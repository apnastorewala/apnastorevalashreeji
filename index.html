    <!-- JavaScript Logic -->
    <script>
        const TELEGRAM_BOT_TOKEN = "8955915195:AAELKsPmB8C0FOUZ8ru0J4FcnScQajJtfA8";
        const TELEGRAM_CHAT_ID = "8391325461"; 

        // Kirana Product Inventory
        const products = [
            { id: 1, name: "Atta (5kg)", category: "Anaj & Dal", price: 200, oldPrice: 290, unit: "5 kg", image: "https://i.ibb.co/qYW2hVFB/IMG20261015172500.jpg" },
            { id: 2, name: "Basmati Rice (1kg)", category: "Anaj & Dal", price: 95, oldPrice: 120, unit: "1 kg", image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400" },
            { id: 3, name: "Toor Dal (1kg)", category: "Anaj & Dal", price: 140, oldPrice: 160, unit: "1 kg", image: "https://images.unsplash.com/photo-1585998014293-21bb3457a410?w=400" },
            { id: 4, name: "Mustard Oil (1L)", category: "Tel & Masale", price: 150, oldPrice: 175, unit: "1 Liter", image: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400" },
            { id: 5, name: "Tata Salt (1kg)", category: "Tel & Masale", price: 28, oldPrice: 30, unit: "1 kg", image: "https://images.unsplash.com/photo-1518112347513-74d98b470942?w=400" },
            { id: 6, name: "Haldi Powder (200g)", category: "Tel & Masale", price: 45, oldPrice: 55, unit: "200 g", image: "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=400" },
            { id: 7, name: "Namkeen", category: "Snacks", price: 20, oldPrice: 25, unit: "Packet", image: "https://images.unsplash.com/photo-1621939514649-280e2ee25f60?w=400" },
            { id: 8, name: "Red Label Tea (250g)", category: "Snacks", price: 145, oldPrice: 160, unit: "250 g", image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400" }
        ];

        // Local Storage
        let cart = JSON.parse(localStorage.getItem('kirana_cart')) || [];
        let ordersList = JSON.parse(localStorage.getItem('kirana_admin_orders')) || [];
        let currentCategory = 'All';

        // Initialize App on Load
        window.onload = function() {
            renderProducts(products);
            updateCartUI();
        };

        // Render Products
        function renderProducts(list) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">Koi saman nahi mila.</p>`;
                return;
            }

            list.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition p-4 border border-gray-100 flex flex-col justify-between">
                        <div>
                            <div class="relative overflow-hidden rounded-lg mb-3 h-40 bg-gray-100">
                                <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                                <span class="absolute top-2 left-2 bg-green-500 text-white text-xs px-2 py-0.5 rounded font-bold">${item.unit}</span>
                            </div>
                            <span class="text-xs text-green-600 font-semibold uppercase tracking-wider">${item.category}</span>
                            <h3 class="font-bold text-gray-800 text-base mb-1 mt-0.5">${item.name}</h3>
                        </div>
                        <div>
                            <div class="flex items-baseline gap-2 mb-3">
                                <span class="text-lg font-extrabold text-gray-900">₹${item.price}</span>
                                <span class="text-xs text-gray-400 line-through">₹${item.oldPrice}</span>
                            </div>
                            <button onclick="addToCart(${item.id})" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 shadow-sm">
                                <i class="fa-solid fa-cart-plus"></i> Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Add to Cart
        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);

            if (exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...prod, qty: 1 });
            }

            saveCart();
            updateCartUI();
            toggleCart();
        }

        function saveCart() {
            localStorage.setItem('kirana_cart', JSON.stringify(cart));
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            drawer.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function updateCartUI() {
            const count = cart.reduce((acc, curr) => acc + curr.qty, 0);
            document.getElementById('cartCount').innerText = count;
            document.getElementById('adminOrderCount').innerText = ordersList.length;

            const list = document.getElementById('cartItemsList');
            list.innerHTML = '';

            let total = 0;

            if (cart.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-8">Aapka cart abhi khali hai.</p>`;
            } else {
                cart.forEach(item => {
                    total += item.price * item.qty;
                    list.innerHTML += `
                        <div class="flex items-center gap-3 border-b pb-3">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded">
                            <div class="flex-1">
                                <h4 class="font-bold text-xs text-gray-800">${item.name}</h4>
                                <p class="text-xs text-green-600 font-semibold">₹${item.price}</p>
                                <div class="flex items-center gap-2 mt-1">
                                    <button onclick="changeQty(${item.id}, -1)" class="w-5 h-5 border rounded flex items-center justify-center text-xs font-bold bg-gray-100">-</button>
                                    <span class="text-xs font-medium">${item.qty}</span>
                                    <button onclick="changeQty(${item.id}, 1)" class="w-5 h-5 border rounded flex items-center justify-center text-xs font-bold bg-gray-100">+</button>
                                </div>
                            </div>
                            <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                });
            }

            document.getElementById('cartTotal').innerText = `₹${total}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            saveCart();
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
            updateCartUI();
        }

        function selectCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText.includes(cat) || (cat === 'All' && btn.innerText === 'All')) {
                    btn.classList.add('bg-green-600', 'text-white');
                    btn.classList.remove('bg-gray-200', 'text-gray-700');
                } else {
                    btn.classList.remove('bg-green-600', 'text-white');
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                }
            });
            filterProducts();
        }

        function filterProducts() {
            const query = (document.getElementById('searchInput').value || document.getElementById('mobileSearchInput').value || '').toLowerCase();
            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'All' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });
            renderProducts(filtered);
        }

        function filterProductsMobile() {
            document.getElementById('searchInput').value = document.getElementById('mobileSearchInput').value;
            filterProducts();
        }

        function openCheckout() {
            if (cart.length === 0) {
                alert("Pehle cart mein saman jodein!");
                return;
            }
            const drawer = document.getElementById('cartDrawer');
            if(!drawer.classList.contains('translate-x-full')) {
                toggleCart();
            }
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        // Place Order
        async function placeOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing Order...`;

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const payMethod = document.getElementById('payMethod').value;

            let total = 0;
            let itemsSummary = "";

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                itemsSummary += `• ${item.name} x ${item.qty} = ₹${itemTotal}\n`;
            });

            const newOrder = {
                id: 'ORD' + Date.now().toString().slice(-6),
                date: new Date().toLocaleString(),
                customer: { name, phone, address },
                items: cart,
                total: total,
                payment: payMethod
            };

            ordersList.unshift(newOrder);
            localStorage.setItem('kirana_admin_orders', JSON.stringify(ordersList));

            const message = `🛒 *NEW ORDER RECEIVED!* 🛒\n\n` +
                            `👤 *Name:* ${name}\n` +
                            `📞 *Phone:* ${phone}\n` +
                            `🏠 *Address:* ${address}\n` +
                            `💳 *Payment:* ${payMethod}\n\n` +
                            `📦 *ORDER ITEMS:*\n${itemsSummary}\n` +
                            `💰 *TOTAL AMOUNT:* ₹${total}`;

            try {
                if(TELEGRAM_BOT_TOKEN && TELEGRAM_CHAT_ID) {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });
                }
            } catch (err) {
                console.log("Telegram notification failed:", err);
            }

            alert("🎉 Thank you! Aapka Order Successfully Place ho gaya hai.");
            cart = [];
            saveCart();
            updateCartUI();
            closeCheckout();
            
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-bag-shopping"></i> Place Order Now`;
        }

        // Admin Panel Functions
        function openAdminModal() {
            renderAdminOrders();
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function renderAdminOrders() {
            const list = document.getElementById('adminOrdersList');
            list.innerHTML = '';

            if (ordersList.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-center py-8">Koi order nahi mila.</p>`;
                return;
            }

            ordersList.forEach(order => {
                let itemsHtml = order.items.map(i => `<li class="text-xs text-gray-600">${i.name} (x${i.qty}) - ₹${i.price * i.qty}</li>`).join('');
                list.innerHTML += `
                    <div class="border rounded-lg p-4 bg-gray-50 shadow-sm">
                        <div class="flex justify-between items-center mb-2 border-b pb-2">
                            <span class="font-bold text-sm text-green-700">${order.id}</span>
                            <span class="text-xs text-gray-500">${order.date}</span>
                        </div>
                        <p class="text-xs font-semibold text-gray-800">Customer: ${order.customer.name} (${order.customer.phone})</p>
                        <p class="text-xs text-gray-600 mb-2">Address: ${order.customer.address}</p>
                        <ul class="list-disc list-inside mb-2 bg-white p-2 rounded border">
                            ${itemsHtml}
                        </ul>
                        <div class="flex justify-between items-center text-xs font-bold pt-1">
                            <span>Payment: ${order.payment}</span>
                            <span class="text-green-600 text-sm">Total: ₹${order.total}</span>
                        </div>
                    </div>
                `;
            });
        }

        function clearAllOrders() {
            if(confirm("Kya aap saare local orders delete karna chahte hain?")) {
                ordersList = [];
                localStorage.removeItem('kirana_admin_orders');
                renderAdminOrders();
                updateCartUI();
            }
        }
                           </script>
